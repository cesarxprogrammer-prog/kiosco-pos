<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiosco POS</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #121212;
    color: #f1f1f1;
    height: 100vh;
    overflow: hidden;
}

.topbar {
    height: 70px;
    background: #222;
    color: white;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 15px;
}

.topbar h1 {
    font-size: 20px;
    margin-right: auto;
}

.search {
    width: 260px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #444;
    font-size: 16px;
    background: #292929;
    color: #f1f1f1;
}

.search::placeholder {
    color: #aaa;
}

.top-btn {
    border: 0;
    border-radius: 8px;
    padding: 11px 13px;
    cursor: pointer;
    font-size: 15px;
}

.main {
    height: calc(100vh - 70px);
    display: flex;
}

.catalog {
    width: 60%;
    padding: 15px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.products-grid {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
}

.product-card {
    background: #1e1e1e;
    border-radius: 10px;
    padding: 14px;
    height: 125px;
    box-shadow: 0 2px 5px #0008;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
}

.product-card:active {
    transform: scale(.97);
}

.product-card.disabled {
    opacity: .45;
    cursor: not-allowed;
}

.p-name {
    font-weight: bold;
    font-size: 14px;
}

.p-price {
    color: #20c997;
    font-size: 17px;
    font-weight: bold;
}

.p-stock {
    font-size: 13px;
    color: #aaa;
}

.p-stock.zero {
    color: #ff5c6c;
    font-weight: bold;
}

.cart {
    width: 40%;
    background: #1e1e1e;
    border-left: 2px solid #333;
    padding: 15px;
    display: flex;
    flex-direction: column;
}

.cart-title {
    font-size: 20px;
    font-weight: bold;
    padding: 10px 0;
    border-bottom: 2px solid #333;
}

.cart-items {
    flex: 1;
    overflow-y: auto;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 12px 0;
    border-bottom: 1px solid #333;
}

.item-details {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.item-name {
    font-weight: bold;
}

.item-price {
    color: #aaa;
    font-size: 13px;
}

.item-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.qty-btn {
    border: 0;
    background: #333;
    color: #f1f1f1;
    border-radius: 5px;
    width: 30px;
    height: 30px;
    cursor: pointer;
    font-weight: bold;
}

.weight-input {
    width: 85px;
    padding: 7px;
    border: 1px solid #444;
    border-radius: 5px;
    background: #292929;
    color: #f1f1f1;
    text-align: center;
    font-size: 15px;
}

.weight-unit {
    color: #aaa;
    font-size: 13px;
}

.weight-options {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 6px;
}

.weight-option {
    border: 0;
    background: #333;
    color: #f1f1f1;
    border-radius: 5px;
    padding: 5px 7px;
    font-size: 12px;
    cursor: pointer;
}

.weight-option:active {
    background: #555;
}

.btn-remove {
    border: 0;
    background: #dc3545;
    color: white;
    border-radius: 5px;
    padding: 7px;
    cursor: pointer;
}

.cart-summary {
    border-top: 2px solid #333;
    padding-top: 12px;
}

.total-row {
    display: flex;
    justify-content: space-between;
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 12px;
}

.checkout {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    background: #198754;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.checkout:disabled {
    background: #555;
}

.modal-bg {
    position: fixed;
    inset: 0;
    background: #000b;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 15px;
}

.modal {
    background: #1e1e1e;
    color: #f1f1f1;
    width: min(600px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 12px;
    padding: 20px;
}

.modal h2 {
    margin-bottom: 15px;
}

.form-group {
    margin-bottom: 12px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 11px;
    border: 1px solid #444;
    border-radius: 7px;
    font-size: 16px;
    background: #292929;
    color: #f1f1f1;
}

.modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.modal-actions button {
    flex: 1;
    padding: 12px;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.btn-primary {
    background: #198754;
    color: white;
}

.btn-secondary {
    background: #444;
    color: #f1f1f1;
}

.btn-danger {
    background: #dc3545;
    color: white;
}

.admin-product,
.sale {
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    background: #242424;
}

.admin-row,
.sale-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.admin-info,
.sale-info {
    flex: 1;
}

.admin-info small,
.sale-info small {
    color: #aaa;
}

.history-status {
    font-weight: bold;
}

.cancelled {
    color: #ff5c6c;
}

.completed {
    color: #20c997;
}

.payment-box {
    background: #292929;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 12px;
}

/* SCANNER */

.scanner-video {
    width: 100%;
    display: block;
    background: #000;
    border-radius: 10px;
    margin-bottom: 12px;
}

.scanner-status {
    text-align: center;
    color: #aaa;
    margin-bottom: 12px;
}

.scanner-code {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 5px;
}

/* CÓDIGO PRODUCTO */

.code-input-row {
    display: flex;
    gap: 8px;
}

.code-input-row input {
    flex: 1;
}

.code-status {
    margin-top: 5px;
    font-size: 13px;
    font-weight: bold;
}

.code-status.available {
    color: #20c997;
}

.code-status.duplicate {
    color: #ff5c6c;
}

/* MÓVIL */

@media (max-width: 700px) {

    body {
        overflow: hidden;
    }

    .topbar {
        height: 60px;
        flex-wrap: nowrap;
    }

    .topbar h1 {
        display: none;
    }

    .search {
        flex: 1;
        min-width: 0;
        width: auto;
    }

    .top-btn {
        padding: 10px;
    }

    .main {
        height: calc(100vh - 60px);
        display: block;
        position: relative;
    }

    .catalog {
        width: 100%;
        height: 60%;
        padding: 10px;
    }

    .products-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
    }

    .product-card {
        height: 110px;
    }

    .cart {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 40%;
        border-left: 0;
        border-top: 2px solid #333;
        padding: 10px;
    }

    .cart.expanded {
        height: 85%;
    }

    .cart-title {
        cursor: pointer;
    }

    .weight-input {
        width: 75px;
    }

    .weight-options {
        justify-content: flex-end;
    }

    .weight-option {
        padding: 5px 6px;
    }
}
</style>
</head>

<body>

<div class="topbar">

    <h1>🛒 Kiosco POS</h1>

    <input
        id="search"
        class="search"
        placeholder="🔍 Buscar producto..."
        oninput="filterProducts()"
    >

    <button
        class="top-btn"
        onclick="openScanner()"
    >
        📷
    </button>

    <button
        class="top-btn"
        onclick="openNewProduct()"
    >
        ＋ Nuevo
    </button>

    <button
        class="top-btn"
        onclick="openHistory()"
    >
        📋
    </button>

    <button
        class="top-btn"
        onclick="exportData()"
    >
        💾
    </button>

    <button
        class="top-btn"
        onclick="openAdmin()"
    >
        ⚙️
    </button>

</div>

<div class="main">

    <section class="catalog">

        <div
            id="products"
            class="products-grid"
        ></div>

    </section>

    <section
        id="cart"
        class="cart"
    >

        <div
            class="cart-title"
            onclick="toggleCart()"
        >
            🛒 Carrito

            <span id="cart-count">
                0
            </span>

            <span style="float:right">

                <span id="total-amount">
                    $0
                </span>

                &nbsp;

                <span id="cart-arrow">
                    ⌃
                </span>

            </span>

        </div>

        <button
            id="checkout-btn"
            class="checkout"
            onclick="openPayment()"
            style="margin:10px 0;"
        >
            Registrar venta
        </button>

        <div
            id="cart-items"
            class="cart-items"
        ></div>

    </section>

</div>

<div
    id="scanner-modal"
    class="modal-bg"
>

    <div class="modal">

        <h2>
            📷 Escanear producto
        </h2>

        <video
            id="scanner-video"
            class="scanner-video"
            autoplay
            playsinline
        ></video>

        <div
            id="scanner-status"
            class="scanner-status"
        >
            Iniciando cámara...
        </div>

        <div
            id="scanner-code"
            class="scanner-code"
        >
            Código: —
        </div>

        <div class="modal-actions">

            <button
                class="btn-secondary"
                onclick="closeScanner()"
            >
                Cerrar
            </button>

        </div>

    </div>

</div>

<div
    id="product-modal"
    class="modal-bg"
>

    <div class="modal">

        <h2 id="product-modal-title">
            Nuevo producto
        </h2>

        <div class="form-group">

            <label>
                Código
            </label>

            <div class="code-input-row">

                <input
                    id="product-code"
                    oninput="validateProductCode()"
                >

                <button
                    type="button"
                    class="top-btn"
                    onclick="openProductScanner()"
                >
                    📷
                </button>

            </div>

            <div
                id="product-code-status"
                class="code-status"
            ></div>

        </div>

        <div class="form-group">

            <label>
                Nombre
            </label>

            <input id="product-name">

        </div>

        <div class="form-group">

            <label>
                Tipo de venta
            </label>

            <select
                id="product-sale-type"
                onchange="toggleWeightOptions()"
            >

                <option value="unit">
                    Por unidad
                </option>

                <option value="weight">
                    Por peso
                </option>

            </select>

        </div>

        <div
            id="weight-options"
            style="display:none"
        >

            <div class="form-group">

                <label>
                    Precio expresado en
                </label>

                <select id="product-price-unit">

                    <option value="100">
                        100 g
                    </option>

                    <option value="1000">
                        1 kg
                    </option>

                </select>

            </div>

        </div>

        <div class="form-group">

            <label>
                Precio
            </label>

            <input
                id="product-price"
                type="number"
                min="0"
                step="0.01"
            >

        </div>

        <div class="form-group">

            <label id="stock-label">
                Stock disponible
            </label>

            <input
                id="product-stock"
                type="number"
                min="0"
                step="1"
            >

        </div>

        <div class="modal-actions">

            <button
                class="btn-secondary"
                onclick="closeModal('product-modal')"
            >
                Cancelar
            </button>

            <button
                class="btn-primary"
                onclick="saveProduct()"
            >
                Guardar
            </button>

            <button
                id="delete-product-btn"
                class="btn-danger"
                onclick="deleteProduct()"
                style="display:none"
            >
                Eliminar
            </button>

        </div>

    </div>

</div>

<div
    id="admin-modal"
    class="modal-bg"
>

    <div class="modal">

        <h2>
            ⚙️ Administración
        </h2>

        <div id="admin-products"></div>

        <div class="modal-actions">

            <button
                class="btn-secondary"
                onclick="closeModal('admin-modal')"
            >
                Cerrar
            </button>

            <button
                class="btn-primary"
                onclick="openNewProductFromAdmin()"
            >
                ＋ Nuevo producto
            </button>

        </div>

    </div>

</div>

<div
    id="history-modal"
    class="modal-bg"
>

    <div class="modal">

        <h2>
            📋 Historial de ventas
        </h2>

        <div id="sales-history"></div>

        <div class="modal-actions">

            <button
                class="btn-secondary"
                onclick="closeModal('history-modal')"
            >
                Cerrar
            </button>

        </div>

    </div>

</div>

<div
    id="payment-modal"
    class="modal-bg"
>

    <div class="modal">

        <h2>
            💳 Registrar venta
        </h2>

        <div class="payment-box">

            <strong>
                Total:
            </strong>

            <span id="payment-total">
                $0
            </span>

        </div>

        <div class="form-group">

            <label>
                Medio de pago
            </label>

            <select id="payment-method">

                <option value="efectivo">
                    💵 Efectivo
                </option>

                <option value="debito">
                    💳 Débito
                </option>

                <option value="credito">
                    💳 Crédito
                </option>

                <option value="transferencia">
                    📱 Transferencia
                </option>

            </select>

        </div>

        <div class="modal-actions">

            <button
                class="btn-secondary"
                onclick="closeModal('payment-modal')"
            >
                Cancelar
            </button>

            <button
                class="btn-primary"
                onclick="confirmSale()"
            >
                Confirmar venta
            </button>

        </div>

    </div>

</div>

<script>

/* =========================================================
   DATOS
========================================================= */

const defaultProducts = [

    {
        id: 1,
        code: "779000000001",
        name: "Alfajor Triple",
        price: 800,
        stock: 20,
        saleType: "unit"
    },

    {
        id: 2,
        code: "779000000002",
        name: "Gaseosa Cola 500ml",
        price: 1200,
        stock: 20,
        saleType: "unit"
    },

    {
        id: 3,
        code: "779000000003",
        name: "Agua Mineral 500ml",
        price: 900,
        stock: 20,
        saleType: "unit"
    },

    {
        id: 4,
        code: "779000000004",
        name: "Chicles de Menta",
        price: 300,
        stock: 20,
        saleType: "unit"
    },

    {
        id: 5,
        code: "779000000005",
        name: "Papas Fritas Bolsa",
        price: 1500,
        stock: 20,
        saleType: "unit"
    }

];

let products =
    JSON.parse(localStorage.getItem("products"))
    || defaultProducts;

let cart =
    JSON.parse(localStorage.getItem("cart"))
    || [];

let sales =
    JSON.parse(localStorage.getItem("sales"))
    || [];

let editingProductId = null;


/* =========================================================
   MIGRACIÓN DE PRODUCTOS
========================================================= */

products.forEach(product => {

    if (!product.saleType) {
        product.saleType = "unit";
    }

    if (
        product.saleType === "weight"
        &&
        !product.priceUnit
    ) {
        product.priceUnit = 1000;
    }

});

saveProducts();


/* =========================================================
   MIGRACIÓN DEL CARRITO
========================================================= */

cart.forEach(item => {

    const product =
        products.find(
            p => p.id === item.id
        );

    if (!product) return;

    if (!item.saleType) {
        item.saleType =
            product.saleType || "unit";
    }

    if (item.saleType === "weight") {

        if (typeof item.weight !== "number") {

            item.weight =
                Number(item.quantity) || 0;

        }

        item.quantity =
            item.weight;

    }

});

saveCart();


/* =========================================================
   SCANNER
========================================================= */

let scannerStream = null;
let scannerActive = false;
let barcodeDetector = null;
let scannerMode = "sale";


async function openScanner(mode = "sale") {

    scannerMode = mode;

    const modal =
        document.getElementById("scanner-modal");

    const video =
        document.getElementById("scanner-video");

    const status =
        document.getElementById("scanner-status");

    const codeLabel =
        document.getElementById("scanner-code");

    const title =
        document.querySelector("#scanner-modal h2");

    modal.style.display = "flex";

    if (scannerMode === "product") {

        title.textContent =
            "📷 Registrar código";

    } else {

        title.textContent =
            "📷 Escanear producto";

    }

    codeLabel.textContent =
        "Código: —";

    scannerActive = false;

    if (!("BarcodeDetector" in window)) {

        status.textContent =
            "❌ Este navegador no soporta BarcodeDetector.";

        return;

    }

    try {

        barcodeDetector =
            new BarcodeDetector({

                formats: [
                    "ean_13",
                    "ean_8",
                    "upc_a",
                    "upc_e",
                    "code_128"
                ]

            });


        /*
         * SOLICITAR LA MAYOR RESOLUCIÓN POSIBLE
         *
         * "ideal" solicita una resolución alta,
         * pero el navegador puede entregar la máxima
         * que soporte realmente la cámara.
         */

        scannerStream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 4096
                    },

                    height: {
                        ideal: 2160
                    },

                    aspectRatio: {
                        ideal: 16 / 9
                    },

                    resizeMode: "none"

                },

                audio: false

            });


        video.srcObject =
            scannerStream;


        /*
         * Mostrar la resolución REAL obtenida.
         */

        const track =
            scannerStream.getVideoTracks()[0];

        const settings =
            track.getSettings();

        console.log(
            "Resolución real de cámara:",
            settings.width,
            "x",
            settings.height
        );


        scannerActive = true;

        status.textContent =
            "🟢 Buscando código...";


        buscarCodigo();

    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ No se pudo iniciar la cámara: "
            + error.name;

    }

}


function openProductScanner() {

    openScanner("product");

}


async function buscarCodigo() {

    if (!scannerActive) return;

    const video =
        document.getElementById("scanner-video");

    try {

        const barcodes =
            await barcodeDetector.detect(video);

        if (barcodes.length > 0) {

            const codigo =
                barcodes[0].rawValue;

            scannerActive = false;

            document.getElementById(
                "scanner-code"
            ).textContent =
                "Código: " + codigo;

            if (scannerMode === "product") {

                detenerScanner();

                document.getElementById(
                    "product-code"
                ).value = codigo;

                validateProductCode();

                document.getElementById(
                    "scanner-status"
                ).textContent =
                    "✅ Código leído";

                setTimeout(() => {
                    closeScanner();
                }, 500);

                return;

            }

            detenerScanner();

            const product =
                products.find(
                    p =>
                        String(p.code) ===
                        String(codigo)
                );

            if (!product) {

                document.getElementById(
                    "scanner-status"
                ).textContent =
                    "❌ Producto no encontrado";

                alert(
                    "No existe un producto con el código "
                    + codigo
                );

                return;

            }

            if (product.stock <= 0) {

                document.getElementById(
                    "scanner-status"
                ).textContent =
                    "❌ Producto sin stock";

                alert(
                    product.name +
                    " no tiene stock disponible."
                );

                return;

            }

            document.getElementById(
                "scanner-status"
            ).textContent =
                "✅ Producto encontrado";

            addToCart(product.id);

            setTimeout(() => {
                closeScanner();
            }, 500);

            return;

        }

    } catch (error) {

        console.error(error);

    }

    requestAnimationFrame(buscarCodigo);

}


function detenerScanner() {

    scannerActive = false;

    if (scannerStream) {

        scannerStream
            .getTracks()
            .forEach(track => track.stop());

        scannerStream = null;

    }

    const video =
        document.getElementById(
            "scanner-video"
        );

    video.srcObject = null;

}


function closeScanner() {

    detenerScanner();

    scannerMode = "sale";

    document.getElementById(
        "scanner-modal"
    ).style.display = "none";

}


/* =========================================================
   STORAGE
========================================================= */

function saveProducts() {

    localStorage.setItem(
        "products",
        JSON.stringify(products)
    );

}


function saveCart() {

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

}


function saveSales() {

    localStorage.setItem(
        "sales",
        JSON.stringify(sales)
    );

}


/* =========================================================
   EXPORTAR DATOS
========================================================= */

function exportData() {

    const exportedSales =
        sales.map(sale => ({

            ...sale,

            items: sale.items.map(item => {

                const {
                    subtotal,
                    ...itemWithoutSubtotal
                } = item;

                return itemWithoutSubtotal;

            })

        }));


    const data = {

        products: products,

        sales: exportedSales,

        exportDate:
            new Date().toISOString()

    };


    const json =
        JSON.stringify(
            data,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type: "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    const date =
        new Date()
            .toISOString()
            .slice(0, 10);


    link.href =
        url;


    link.download =
        "kiosco_backup_" +
        date +
        ".json";


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);


    alert(
        "Datos exportados correctamente."
    );

}

                    );

                product.stock =

                        product.stock -

                    );

                        product.stock -

/* =========================================================
   CATÁLOGO
========================================================= */

function renderCatalog(list) {

    const container =
        document.getElementById(
            "products"
        );

    container.innerHTML = "";

    list.forEach(product => {

        const card =
            document.createElement("div");

        card.className =
            "product-card";

        if (product.stock <= 0) {

            card.classList.add(
                "disabled"
            );

        }

        card.onclick = () => {

            if (product.stock > 0) {
                addToCart(product.id);
            }

        };


        let stockText;

        if (product.stock <= 0) {

            stockText =
                "Sin stock";

        } else if (
            product.saleType === "weight"
        ) {

            stockText =
                `Stock: ${formatWeight(
                    product.stock
                )}`;

        } else {

            stockText =
                `Stock: ${product.stock}`;

        }


        let priceText;

        if (product.saleType === "weight") {

            const unit =
                Number(product.priceUnit) === 100
                    ? "100 g"
                    : "1 kg";

            priceText =
                `$${formatMoney(
                    product.price
                )} / ${unit}`;

        } else {

            priceText =
                `$${formatMoney(
                    product.price
                )}`;

        }


        card.innerHTML = `

            <div class="p-name">
                ${escapeHTML(product.name)}
            </div>

            <div class="p-price">
                ${priceText}
            </div>

            <div
                class="p-stock ${
                    product.stock <= 0
                        ? "zero"
                        : ""
                }"
            >
                ${stockText}
            </div>

        `;

        container.appendChild(card);

    });

}


function filterProducts() {

    const query =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();

    const filtered =
        products.filter(product =>

            product.name
                .toLowerCase()
                .includes(query)

            ||

            String(product.code)
                .includes(query)

        );

    renderCatalog(filtered);

}


/* =========================================================
   CARRITO — AGREGAR
========================================================= */

function addToCart(id) {

    const product =
        products.find(
            p => p.id === id
        );

    if (
        !product
        ||
        product.stock <= 0
    ) {

        alert(
            "No hay stock disponible."
        );

        return;

    }


    if (product.saleType === "weight") {

        const existing =
            cart.find(
                item => item.id === id
            );

        if (existing) {
            return;
        }

        const defaultWeight =
            Number(product.priceUnit) === 100
                ? 100
                : 1000;

        if (product.stock < defaultWeight) {

            alert(
                "No hay suficiente stock para "
                +
                formatWeight(defaultWeight)
                +
                "."
            );

            return;

        }

        product.stock -=
            defaultWeight;

        cart.push({

            id: product.id,

            code: product.code,

            name: product.name,

            price: product.price,

            saleType: "weight",

            priceUnit:
                Number(product.priceUnit)
                || 1000,

            weight: defaultWeight,

            quantity: defaultWeight

        });

        saveProducts();
        saveCart();

        renderCatalog(
            getFilteredProducts()
        );

        updateCartUI();

        return;

    }


    const existing =
        cart.find(
            item => item.id === id
        );

    product.stock -= 1;

    if (existing) {

        existing.quantity += 1;

    } else {

        cart.push({

            id: product.id,

            code: product.code,

            name: product.name,

            price: product.price,

            saleType: "unit",

            quantity: 1

        });

    }

    saveProducts();
    saveCart();

    renderCatalog(
        getFilteredProducts()
    );

    updateCartUI();

}


/* =========================================================
   CARRITO — CANTIDAD
========================================================= */

function increaseCart(id) {

    const product =
        products.find(
            p => p.id === id
        );

    if (
        product
        &&
        product.saleType === "weight"
    ) {
        return;
    }

    addToCart(id);

}


function decreaseCart(id) {

    const item =
        cart.find(
            i => i.id === id
        );

    if (!item) return;

    const product =
        products.find(
            p => p.id === id
        );

    if (!product) return;


    if (
        product.saleType === "weight"
        ||
        item.saleType === "weight"
    ) {
        return;
    }


    product.stock += 1;

    item.quantity -= 1;

    if (item.quantity <= 0) {

        cart =
            cart.filter(
                i => i.id !== id
            );

    }

    saveProducts();
    saveCart();

    renderCatalog(
        getFilteredProducts()
    );

    updateCartUI();

}


/* =========================================================
   CAMBIAR PESO
========================================================= */

function changeCartWeight(id, value) {

    const item =
        cart.find(
            i => i.id === id
        );

    if (!item) return;

    const product =
        products.find(
            p => p.id === id
        );

    if (!product) return;

    if (
        product.saleType !== "weight"
    ) {
        return;
    }

    let newWeight =
        Number(value);

    if (
        !Number.isFinite(newWeight)
        ||
        newWeight <= 0
    ) {
        return;
    }

    newWeight =
        Math.floor(newWeight);

    const oldWeight =
        Number(item.weight) || 0;

    const difference =
        newWeight - oldWeight;


    if (difference > 0) {

        if (
            product.stock <
            difference
        ) {

            alert(
                "No hay suficiente stock disponible."
            );

            updateCartUI();

            return;

        }

        product.stock -=
            difference;

    }


    if (difference < 0) {

        product.stock +=
            Math.abs(difference);

    }


    item.weight =
        newWeight;

    item.quantity =
        newWeight;

    saveProducts();
    saveCart();

    renderCatalog(
        getFilteredProducts()
    );

    updateCartUI();

}


/* =========================================================
   SUGERENCIAS DE PESO
========================================================= */

function setSuggestedWeight(id, weight) {

    changeCartWeight(
        id,
        weight
    );

}


function getWeightSuggestions(priceUnit) {

    if (
        Number(priceUnit) === 100
    ) {

        return [
            50,
            100,
            150,
            200
        ];

    }

    return [
        250,
        500,
        750,
        1000
    ];

}


function renderWeightSuggestions(
    id,
    priceUnit,
    currentWeight
) {

    const suggestions =
        getWeightSuggestions(
            priceUnit
        );

    return `

        <div class="weight-options">

            ${
                suggestions
                    .map(weight => `

                        <button
                            type="button"
                            class="weight-option"
                            onclick="
                                setSuggestedWeight(
                                    ${id},
                                    ${weight}
                                )
                            "
                        >
                            ${
                                weight >= 1000
                                    ? "1 kg"
                                    : weight + " g"
                            }
                        </button>

                    `)
                    .join("")
            }

        </div>

    `;

}


/* =========================================================
   ELIMINAR DEL CARRITO
========================================================= */

function removeFromCart(id) {

    const item =
        cart.find(
            i => i.id === id
        );

    if (!item) return;

    const product =
        products.find(
            p => p.id === id
        );

    if (product) {

        if (
            product.saleType === "weight"
            ||
            item.saleType === "weight"
        ) {

            product.stock +=
                Number(
                    item.weight ??
                    item.quantity ??
                    0
                );

        } else {

            product.stock +=
                Number(item.quantity)
                || 0;

        }

    }

    cart =
        cart.filter(
            i => i.id !== id
        );

    saveProducts();
    saveCart();

    renderCatalog(
        getFilteredProducts()
    );

    updateCartUI();

}


/* =========================================================
   VACIAR CARRITO
========================================================= */

function clearCart() {

    cart.forEach(item => {

        const product =
            products.find(
                p => p.id === item.id
            );

        if (product) {

            if (
                product.saleType === "weight"
                ||
                item.saleType === "weight"
            ) {

                product.stock +=
                    Number(
                        item.weight ??
                        item.quantity ??
                        0
                    );

            } else {

                product.stock +=
                    Number(item.quantity)
                    || 0;

            }

        }

    });

    cart = [];

    saveProducts();
    saveCart();

    renderCatalog(
        getFilteredProducts()
    );

    updateCartUI();

}

/* =========================================================
   TOTAL
========================================================= */

function getCartTotal() {

    return cart.reduce(
        (sum, item) => {

            const product =
                products.find(
                    p => p.id === item.id
                );

            const isWeight =
                item.saleType === "weight"
                ||
                (
                    product
                    &&
                    product.saleType === "weight"
                );


            if (isWeight) {

                const weight =
                    Number(
                        item.weight ??
                        item.quantity ??
                        0
                    );

                const priceUnit =
                    Number(
                        item.priceUnit ??
                        product?.priceUnit ??
                        1000
                    );

                return sum +
                    (
                        weight *
                        Number(item.price) /
                        priceUnit
                    );

            }

            return sum +
                Number(item.price) *
                Number(item.quantity);

        },
        0
    );

}

function confirmSale() {

    if (cart.length === 0) {

        closeModal(
            "payment-modal"
        );

        return;

    }

    const total =
        getCartTotal();

    const paymentMethod =
        document.getElementById(
            "payment-method"
        ).value;


    const sale = {

        id: Date.now(),

        date:
            new Date().toISOString(),

        status: "realizada",

        paymentMethod:
            paymentMethod,

        items:
            cart.map(item => {

                const product =
                    products.find(
                        p => p.id === item.id
                    );

                const isWeight =
                    item.saleType === "weight"
                    ||
                    (
                        product
                        &&
                        product.saleType === "weight"
                    );


                if (isWeight) {

                    const weight =
                        Number(
                            item.weight ??
                            item.quantity ??
                            0
                        );

                    const priceUnit =
                        Number(
                            item.priceUnit ??
                            product?.priceUnit ??
                            1000
                        );

                    return {

                        id: item.id,

                        code: item.code,

                        name: item.name,

                        price: item.price,

                        saleType: "weight",

                        priceUnit:
                            priceUnit,

                        weight: weight,

                        quantity: weight,

                        subtotal:
                            weight *
                            Number(item.price) /
                            priceUnit

                    };

                }


                return {

                    id: item.id,

                    code: item.code,

                    name: item.name,

                    price: item.price,

                    saleType: "unit",

                    quantity: item.quantity,

                    subtotal:
                        Number(item.price) *
                        Number(item.quantity)

                };

    cart = [];

    saveCart();

    updateCartUI();

        getFilteredProducts()
    );

        "payment-modal"

    );

/* =========================================================
   ANULAR VENTA
========================================================= */

function cancelSale(id) {

    const sale =
        sales.find(
            s => s.id === id
        );

    if (
        !sale
        ||
        sale.status === "anulada"
    ) {
        return;
    }

    if (
        !confirm(
            "¿Anular esta venta y devolver el stock?"
        )
    ) {
        return;
    }

    sale.status =
        "anulada";

    sale.cancelledAt =
        new Date().toISOString();


    sale.items.forEach(item => {

        const product =
            products.find(
                p => p.id === item.id
            );

        if (product) {

            if (
                item.saleType === "weight"
                ||
                product.saleType === "weight"
            ) {

                product.stock +=
                    Number(
                        item.weight ??
                        item.quantity ??
                        0
                    );

            } else {

                product.stock +=
                    Number(item.quantity)
                    || 0;

            }

        }

    });


    saveProducts();
    saveSales();

    renderCatalog(
        getFilteredProducts()
    );

    renderHistory();

}

        "product-sale-type"
    ).value =
        "unit";

    document.getElementById(
        "product-price-unit"
    ).value =
        "100";

    document.getElementById(
        "product-price"
    ).value = "";

    document.getElementById(
        "product-stock"
    ).value =
        "0";

    document.getElementById(
        "delete-product-btn"
    ).style.display =
        "none";

    document.getElementById(
        "product-code-status"
    ).textContent = "";

    document.getElementById(
        "product-code-status"
    ).className =
        "code-status";

    toggleWeightOptions();

    document.getElementById(
        "product-modal"
    ).style.display =
        "flex";

}


function openNewProductFromAdmin() {

    closeModal(
        "admin-modal"
    );

    openNewProduct();

}


/* =========================================================
   EDITAR PRODUCTO
========================================================= */

function openEditProduct(id) {

    const product =
        products.find(
            p => p.id === id
        );

    if (!product) return;

    editingProductId =
        id;

    document.getElementById(
        "product-modal-title"
    ).textContent =
        "Editar producto";

    document.getElementById(
        "product-code"
    ).value =
        product.code;

    document.getElementById(
        "product-name"
    ).value =
        product.name;

    document.getElementById(
        "product-sale-type"
    ).value =
        product.saleType ||
        "unit";

    document.getElementById(
        "product-price-unit"
    ).value =
        product.priceUnit ||
        "1000";

    document.getElementById(
        "product-price"
    ).value =
        product.price;

    document.getElementById(
        "product-stock"
    ).value =
        product.stock;

    document.getElementById(
        "delete-product-btn"
    ).style.display =
        "block";

    toggleWeightOptions();

    validateProductCode();

    closeModal(
        "admin-modal"
    );

    document.getElementById(
        "product-modal"
    ).style.display =
        "flex";

}


/* =========================================================
   CONFIGURACIÓN PESO
========================================================= */

function toggleWeightOptions() {

    const saleType =
        document.getElementById(
            "product-sale-type"
        ).value;

    const options =
        document.getElementById(
            "weight-options"
        );

    const stockLabel =
        document.getElementById(
            "stock-label"
        );


    if (saleType === "weight") {

        options.style.display =
            "block";

        stockLabel.textContent =
            "Stock disponible (gramos)";

    } else {

        options.style.display =
            "none";

        stockLabel.textContent =
            "Stock disponible";

    }

}


/* =========================================================
   VALIDACIÓN CÓDIGO
========================================================= */

function validateProductCode() {

    const input =
        document.getElementById(
            "product-code"
        );

    const status =
        document.getElementById(
            "product-code-status"
        );

    const code =
        input.value.trim();

    status.textContent =
        "";

    status.className =
        "code-status";


    if (!code) {
        return false;
    }


    const duplicate =
        products.find(
            p =>
                String(p.code) ===
                String(code)
                &&
                p.id !==
                editingProductId
        );


    if (duplicate) {

        status.textContent =
            "⚠️ Este código ya está registrado.";

        status.classList.add(
            "duplicate"
        );

        return false;

    }


    status.textContent =
        "✅ Código disponible";

    status.classList.add(
        "available"
    );

    return true;

}


/* =========================================================
   GUARDAR PRODUCTO
========================================================= */

function saveProduct() {

    const code =
        document.getElementById(
            "product-code"
        ).value.trim();

    const name =
        document.getElementById(
            "product-name"
        ).value.trim();

    const saleType =
        document.getElementById(
            "product-sale-type"
        ).value;

    const price =
        Number(
            document.getElementById(
                "product-price"
            ).value
        );

    const stock =
        Number(
            document.getElementById(
                "product-stock"
            ).value
        );

    const priceUnit =
        Number(
            document.getElementById(
                "product-price-unit"
            ).value
        );


    if (!code || !name) {

        alert(
            "Completá código y nombre."
        );

        return;

    }


    if (
        price < 0
        ||
        stock < 0
    ) {

        alert(
            "Precio y stock no pueden ser negativos."
        );

        return;

    }


    if (
        saleType === "weight"
        &&
        ![100, 1000].includes(
            priceUnit
        )
    ) {

        alert(
            "Seleccioná si el precio corresponde a 100 g o 1 kg."
        );

        return;

    }


    if (!validateProductCode()) {

        alert(
            "Ya existe un producto con ese código."
        );

        return;

    }


    if (editingProductId === null) {

        const newProduct = {

            id: Date.now(),

            code: code,

            name: name,

            price: price,

            stock: stock,

            saleType: saleType

        };


        if (saleType === "weight") {

            newProduct.priceUnit =
                priceUnit;

        }


        products.push(
            newProduct
        );

    } else {

        const product =
            products.find(
                p =>
                    p.id ===
                    editingProductId
            );

        if (!product) return;


        product.code =
            code;

        product.name =
            name;

        product.price =
            price;

        product.stock =
            stock;

        product.saleType =
            saleType;


        if (saleType === "weight") {

            product.priceUnit =
                priceUnit;

        } else {

            delete product.priceUnit;

        }


        const cartItem =
            cart.find(
                item =>
                    item.id ===
                    product.id
            );


        if (cartItem) {

            cartItem.code =
                code;

            cartItem.name =
                name;

            cartItem.price =
                price;

            cartItem.saleType =
                saleType;


            if (
                saleType ===
                "weight"
            ) {

                cartItem.priceUnit =
                    priceUnit;

            } else {

                delete cartItem.priceUnit;

            }

            saveCart();

        }

    }


    saveProducts();

    closeModal(
        "product-modal"
    );

    renderCatalog(
        getFilteredProducts()
    );

    updateCartUI();

}


/* =========================================================
   ELIMINAR PRODUCTO
========================================================= */

function deleteProduct() {

    if (
        editingProductId ===
        null
    ) {
        return;
    }


    const inCart =
        cart.some(
            item =>
                item.id ===
                editingProductId
        );


    if (inCart) {

        alert(
            "No podés eliminar un producto que está en el carrito."
        );

        return;

    }


    if (
        !confirm(
            "¿Eliminar este producto?"
        )
    ) {
        return;
    }


    products =
        products.filter(
            p =>
                p.id !==
                editingProductId
        );

    saveProducts();

    closeModal(
        "product-modal"
    );

    renderCatalog(
        getFilteredProducts()
    );

}


/* =========================================================
   UTILIDADES
========================================================= */

function closeModal(id) {

    document.getElementById(
        id
    ).style.display =
        "none";

}


function getFilteredProducts() {

    const query =
        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase()
            .trim();


    if (!query) {
        return products;
    }


    return products.filter(
        product =>

            product.name
                .toLowerCase()
                .includes(query)

            ||

            String(product.code)
                .includes(query)

    );

}


function formatMoney(value) {

    return Number(value)
        .toLocaleString(
            "es-AR",
            {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }
        );

}


function formatWeight(value) {

    return Number(value)
        .toLocaleString(
            "es-AR"
        );

}


function paymentName(method) {

    const names = {

        efectivo: "Efectivo",

        debito: "Débito",

        credito: "Crédito",

        transferencia: "Transferencia"

    };

    return names[method]
        ||
        method
        ||
        "Sin especificar";

}


function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   CARRITO MÓVIL
========================================================= */

function toggleCart() {

    const cartElement =
        document.getElementById(
            "cart"
        );

    const arrow =
        document.getElementById(
            "cart-arrow"
        );


    cartElement.classList.toggle(
        "expanded"
    );


    arrow.textContent =
        cartElement.classList.contains(
            "expanded"
        )
            ? "⌄"
            : "⌃";

}


/* =========================================================
   INICIO
========================================================= */

renderCatalog(products);

updateCartUI();

</script>
