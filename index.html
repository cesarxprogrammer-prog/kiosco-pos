<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prueba de lector</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#121212;
    color:#f1f1f1;
    font-family:Arial,sans-serif;
    min-height:100vh;
    padding:20px;
    text-align:center;
}

h1{
    font-size:22px;
}

video{
    width:100%;
    max-width:500px;
    margin:20px auto;
    display:block;
    border-radius:12px;
    background:#000;
}

button{
    width:100%;
    max-width:500px;
    padding:15px;
    border:0;
    border-radius:8px;
    background:#198754;
    color:white;
    font-size:18px;
}

#result{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
}

#status{
    margin-top:10px;
    color:#aaa;
}
</style>
</head>

<body>

<h1>📷 Lector de código</h1>

<video
    id="video"
    autoplay
    playsinline>
</video>

<button onclick="iniciarScanner()">
    Iniciar lector
</button>

<div id="status">
    Lector detenido
</div>

<div id="result">
    Código: —
</div>


<script>

let stream = null;
let scannerActivo = false;

async function iniciarScanner(){

    const video =
        document.getElementById("video");

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");


    if(!("BarcodeDetector" in window)){

        status.textContent =
            "❌ Este navegador no soporta BarcodeDetector.";

        return;

    }


    try{

        stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"environment"
                },

                audio:false

            });


        video.srcObject = stream;

        scannerActivo = true;

        status.textContent =
            "🟢 Buscando código...";

        buscarCodigo();


    }catch(error){

        console.error(error);

        status.textContent =
            "❌ Error: " + error.name;

    }

}


async function buscarCodigo(){

    if(!scannerActivo)
        return;


    const video =
        document.getElementById("video");


    const detector =
        new BarcodeDetector({

            formats:[
                "ean_13",
                "ean_8",
                "upc_a",
                "upc_e",
                "code_128"
            ]

        });


    try{

        const barcodes =
            await detector.detect(video);


        if(barcodes.length > 0){

            const codigo =
                barcodes[0].rawValue;


            document.getElementById(
                "result"
            ).textContent =
                "Código: " + codigo;


            document.getElementById(
                "status"
            ).textContent =
                "✅ Código detectado";


            scannerActivo = false;


            if(stream){

                stream
                    .getTracks()
                    .forEach(track => track.stop());

            }


            return;

        }

    }catch(error){

        console.error(error);

    }


    requestAnimationFrame(buscarCodigo);

}

</script>

</body>
</html>
