<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiosco POS</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="topbar">

    <h1>🛒 Kiosco POS</h1>

    <input
        id="search"
        class="search"
        placeholder="🔍 Buscar producto..."
        oninput="filterProducts()"
    >

    <button
        class="top-btn"
        onclick="openScanner()"
    >
        📷
    </button>

    <button
        class="top-btn"
        onclick="openNewProduct()"
    >
        ＋ Nuevo
    </button>

    <button
        class="top-btn"
        onclick="openHistory()"
    >
        📋
    </button>

    <button
        class="top-btn"
        onclick="exportData()"
    >
        💾
    </button>

    <button
        class="top-btn"
        onclick="openAdmin()"
    >
        ⚙️
    </button>

</div>

<div class="main">

    <section class="catalog">

        <div
            id="products"
            class="products-grid"
        ></div>

    </section>

    <section
        id="cart"
        class="cart"
    >

        <div
            class="cart-title"
            onclick="toggleCart()"
        >
            🛒 Carrito

            <span id="cart-count">
                0
            </span>

            <span style="float:right">

                <span id="total-amount">
                    $0
                </span>

                &nbsp;

                <span id="cart-arrow">
                    ⌃
                </span>

            </span>

        </div>

        <button
            id="checkout-btn"
            class="checkout"
            onclick="openPayment()"
            style="margin:10px 0;"
        >
            Registrar venta
        </button>

        <div
            id="cart-items"
            class="cart-items"
        ></div>

    </section>

</div>

<div
    id="scanner-modal"
    class="modal-bg"
>

    <div class="modal">

        <h2>
            📷 Escanear producto
        </h2>

        <div
            id="scanner-product-message"
            class="scanner-product-message"
        ></div>

        <video
            id="scanner-video"
            class="scanner-video"
            autoplay
            playsinline
        ></video>

        <div
            id="scanner-status"
            class="scanner-status"
        >
            Iniciando cámara...
        </div>

        <div
            id="scanner-code"
            class="scanner-code"
        >
            Código: —
        </div>

        <div class="modal-actions">

            <button
                class="btn-primary"
                onclick="closeScanner()"
            >
                OK
            </button>

        </div>

    </div>

</div>

<div
    id="product-modal"
    class="modal-bg"
>

    <div class="modal">

        <h2 id="product-modal-title">
            Nuevo producto
        </h2>

        <div class="form-group">

            <label>
                Código
            </label>

            <div class="code-input-row">

                <input
                    id="product-code"
                    oninput="validateProductCode()"
                >

                <button
                    type="button"
                    class="top-btn"
                    onclick="openProductScanner()"
                >
                    📷
                </button>

            </div>

            <div
                id="product-code-status"
                class="code-status"
            ></div>

        </div>

        <div class="form-group">

            <label>
                Nombre
            </label>

            <input id="product-name">

        </div>

        <div class="form-group">

            <label>
                Tipo de venta
            </label>

            <select
                id="product-sale-type"
                onchange="toggleWeightOptions()"
            >

                <option value="unit">
                    Por unidad
                </option>

                <option value="weight">
                    Por peso
                </option>

            </select>

        </div>

        <div
            id="weight-options"
            style="display:none"
        >

            <div class="form-group">

                <label>
                    Precio expresado en
                </label>

                <select id="product-price-unit">

                    <option value="100">
                        100 g
                    </option>

                    <option value="1000">
                        1 kg
                    </option>

                </select>

            </div>

        </div>

        <div class="form-group">

            <label>
                Precio
            </label>

            <input
                id="product-price"
                type="number"
                min="0"
                step="0.01"
            >

        </div>

        <div class="form-group">

            <label id="stock-label">
                Stock disponible
            </label>

            <input
                id="product-stock"
                type="number"
                min="0"
                step="1"
            >

        </div>

        <div class="modal-actions">

            <button
                class="btn-secondary"
                onclick="closeModal('product-modal')"
            >
                Cancelar
            </button>

            <button
                class="btn-primary"
                onclick="saveProduct()"
            >
                Guardar
            </button>

            <button
                id="delete-product-btn"
                class="btn-danger"
                onclick="deleteProduct()"
                style="display:none"
            >
                Eliminar
            </button>

        </div>

    </div>

</div>

<div
    id="admin-modal"
    class="modal-bg"
>

    <div class="modal">

        <h2>
            ⚙️ Administración
        </h2>

        <div id="admin-products"></div>

        <div class="modal-actions">

            <button
                class="btn-secondary"
                onclick="closeModal('admin-modal')"
            >
                Cerrar
            </button>

            <button
                class="btn-primary"
                onclick="openNewProductFromAdmin()"
            >
                ＋ Nuevo producto
            </button>

        </div>

    </div>

</div>

<div
    id="history-modal"
    class="modal-bg"
>

    <div class="modal">

        <h2>
            📋 Historial de ventas
        </h2>

        <div id="sales-history"></div>

        <div class="modal-actions">

            <button
                class="btn-secondary"
                onclick="closeModal('history-modal')"
            >
                Cerrar
            </button>

        </div>

    </div>

</div>

<div
    id="payment-modal"
    class="modal-bg"
>

    <div class="modal">

        <h2>
            💳 Registrar venta
        </h2>

        <div class="payment-box">

            <strong>
                Total:
            </strong>

            <span id="payment-total">
                $0
            </span>

        </div>

        <div class="form-group">

            <label>
                Medio de pago
            </label>

            <select
                id="payment-method"
                onchange="updatePaymentMethod()"
            >

                <option value="efectivo">
                    💵 Efectivo
                </option>

                <option value="debito">
                    💳 Débito
                </option>

                <option value="transferencia">
                    📱 Transferencia
                </option>

            </select>

        </div>

        <div
            id="cash-payment-box"
            class="payment-change"
        >

            <div class="form-group">

                <label>
                    Monto recibido
                </label>

                <input
                    id="cash-received"
                    type="number"
                    min="0"
                    step="0.01"
                    placeholder="$0"
                    oninput="calculateChange()"
                >

                <div class="cash-bills">

                    <button
                        type="button"
                        class="cash-bill"
                        onclick="addCashBill(100)"
                    >
                        $100
                    </button>

                    <button
                        type="button"
                        class="cash-bill"
                        onclick="addCashBill(200)"
                    >
                        $200
                    </button>

                    <button
                        type="button"
                        class="cash-bill"
                        onclick="addCashBill(500)"
                    >
                        $500
                    </button>

                    <button
                        type="button"
                        class="cash-bill"
                        onclick="addCashBill(1000)"
                    >
                        $1.000
                    </button>

                    <button
                        type="button"
                        class="cash-bill"
                        onclick="addCashBill(2000)"
                    >
                        $2.000
                    </button>

                    <button
                        type="button"
                        class="cash-bill"
                        onclick="addCashBill(10000)"
                    >
                        $10.000
                    </button>

                    <button
                        type="button"
                        class="cash-bill"
                        onclick="addCashBill(20000)"
                    >
                        $20.000
                    </button>

                </div>

                <div class="cash-controls">

                    <button
                        type="button"
                        class="cash-control"
                        onclick="removeLastCashBill()"
                    >
                        ↩ Borrar último
                    </button>

                    <button
                        type="button"
                        class="cash-control danger"
                        onclick="clearCashReceived()"
                    >
                        🗑 Limpiar
                    </button>

                </div>

            </div>

            <div
                id="cash-change"
                class="payment-change-result"
            >
                Vuelto: $0
            </div>

        </div>

        <div class="modal-actions">

            <button
                class="btn-secondary"
                onclick="closeModal('payment-modal')"
            >
                Cancelar
            </button>

            <button
                id="confirm-sale-btn"
                class="btn-primary"
                onclick="confirmSale()"
                disabled
            >
                Confirmar venta
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
